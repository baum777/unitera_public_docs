schema_version: 0.4.0
repository:
  name: unitera_public_docs
  role: PUBLIC_DOCUMENTATION_PROJECTION
  visibility: public
  authority: NONE_BY_ITSELF
localization:
  canonical_content_model: mirrored_language_editions
  editions:
    de:
      root: docs/de
      label: Deutsch
    en:
      root: docs/en
      label: English
  substantive_changes_require_sync: true
snapshot:
  reviewed_at: "2026-09-04"
  source_verification: VERIFIED_OWNER_SOURCES_WITH_EXPLICITLY_LABELED_OWNER_CONFIRMED_CANDIDATES
  candidate_projection: PRESENT_PENDING_CANONICAL_ADOPTION
  detail_level: PUBLIC_ABSTRACTED
disclosure:
  policy: CURATED_NON_RECONSTRUCTABLE
  exact_owner_topology_published: false
  exact_source_refs_published: false
  branch_and_change_state_published: false
  internal_contract_ids_published: false
  provider_or_credential_routing_published: false
source_policy:
  owner_source_wins_on_conflict: true
  public_docs_create_authority: false
  public_provenance_is_abstracted: true
  candidates_must_be_labeled: true
public_state:
  core_architecture: ESTABLISHED
  institutional_knowledge: BOUNDED_IMPLEMENTATION
  product_experience: ACTIVE_DEVELOPMENT
  personal_continuity: CONTRACT_AND_PRODUCT_DIRECTION
  local_runtime: BOUNDED_ARCHITECTURE
  governed_external_effects: DELIBERATELY_LIMITED
  pilot: PREPARATION
  production_autonomy_claimed: false
publication_gate:
  - verify_owner_sources_internally
  - publish_only_curated_abstraction
  - preserve_candidate_labels
  - prevent_topology_reconstruction
  - avoid_unverified_production_or_compliance_claims
