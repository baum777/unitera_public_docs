schema_version: 0.6.0
repository:
  name: unitera_public_docs
  role: PUBLIC_DOCUMENTATION_PROJECTION
  visibility: public
  authority: NONE_BY_ITSELF
localization:
  canonical_content_model: mirrored_language_editions
  editions:
    de:
      root: docs/de
      label: Deutsch
    en:
      root: docs/en
      label: English
  substantive_changes_require_sync: true
snapshot:
  reviewed_at: "2026-09-25"
  source_verification: VERIFIED_CURRENT_OWNER_SOURCES_WITH_POST_SNAPSHOT_RUNTIME_AND_PRESENTATION_RECONCILIATION
  candidate_projection: EXCLUDED_FROM_CURRENT_STATE_UNLESS_EXPLICITLY_LABELED
  detail_level: PUBLIC_ABSTRACTED
disclosure:
  policy: CURATED_NON_RECONSTRUCTABLE
  exact_owner_topology_published: false
  exact_source_refs_published: false
  branch_and_change_state_published: false
  internal_contract_ids_published: false
  provider_or_credential_routing_published: false
source_policy:
  owner_source_wins_on_conflict: true
  public_docs_create_authority: false
  public_provenance_is_abstracted: true
  candidates_must_be_labeled: true
  derived_projection_may_lag_owner_state: true
  unmerged_candidate_counts_as_current_state: false
public_state:
  core_architecture: ESTABLISHED
  institutional_knowledge: ACTIVE_VERSIONED_BASELINE_WITH_BOUNDED_INTEGRATION
  product_experience: BOUNDED_MULTI_SURFACE_IMPLEMENTATION
  native_surfaces: CONTRACT_BASELINE_MATERIALIZED_E2E_PENDING
  personal_continuity: BOUNDED_IMPLEMENTATION_RUNTIME_CROSSING_GATED
  local_runtime: BOUNDED_IMPLEMENTATION
  cognition: BOUNDED_ROUTING_AND_EVIDENCE_CONTRACTS_RUNTIME_GATED
  governed_external_effects: BOUNDED_RUNTIME_PATHS_LIVE_READINESS_GATED
  security_evaluation: MATERIALIZED_CLASSIFICATION_AND_QUALIFICATION
  pilot: PREPARATION_WITH_EXTERNAL_AND_ACTIVATION_GATES_OPEN
  production_autonomy_claimed: false
publication_gate:
  - verify_owner_sources_internally
  - publish_only_curated_abstraction
  - preserve_candidate_labels
  - prevent_topology_reconstruction
  - avoid_unverified_production_or_compliance_claims
