name: Public disclosure

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  disclosure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/check_public_disclosure.py
