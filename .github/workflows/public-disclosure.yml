name: Public disclosure

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  disclosure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check restricted disclosure
        run: python3 scripts/check_public_disclosure.py
      - name: Check public document structure
        run: python3 scripts/check_public_structure.py
      - name: Check public snapshot synchronization
        run: python3 scripts/check_public_status_sync.py
      - name: Check DE/EN structural parity
        run: python3 scripts/check_language_parity.py
